# Open on a Mac with: brew install xcodegen && xcodegen generate && open CardPick.xcodeproj
name: CardPick
options:
  bundleIdPrefix: com.balu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  CardPickCore:
    path: Packages/CardPickCore
targets:
  CardPick:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CardPick
        excludes:
          - Info.plist
    dependencies:
      - package: CardPickCore
        product: CardPickCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balu.cardpick
        PRODUCT_NAME: CardPick
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CardPick/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
schemes:
  CardPick:
    build:
      targets:
        CardPick: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
